# ============================================
# setup-structure.yml — 一次性目錄重組 + 產 STARTUP
# 位置：.github/workflows/setup-structure.yml
# ============================================

name: Setup Structure + Build STARTUP

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  setup-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create directory structure
        run: |
          mkdir -p docs/common
          mkdir -p docs/skills/W
          mkdir -p docs/records
          mkdir -p docs/projects/family-fin
          mkdir -p docs/projects/ai-training

      - name: Move C-* to docs/common/
        run: |
          for f in C-*.md; do
            if [ -f "$f" ]; then
              git mv "$f" docs/common/ || mv "$f" docs/common/
            fi
          done

      - name: Move W-* to docs/skills/W/
        run: |
          for f in W-*.md; do
            if [ -f "$f" ]; then
              git mv "$f" docs/skills/W/ || mv "$f" docs/skills/W/
            fi
          done

      - name: Move R-* to docs/records/
        run: |
          for f in R-*.md; do
            if [ -f "$f" ]; then
              git mv "$f" docs/records/ || mv "$f" docs/records/
            fi
          done

      - name: Move P-* to docs/projects/family-fin/
        run: |
          for f in P-*.md; do
            if [ -f "$f" ]; then
              git mv "$f" docs/projects/family-fin/ || mv "$f" docs/projects/family-fin/
            fi
          done

      # ─────────────────────────────────────────────
      # 1. 生成 STARTUP-core-webapp.md（啟動檢查）
      # ─────────────────────────────────────────────
      - name: Build STARTUP-core-webapp.md
        run: |
          OUTPUT="STARTUP-core-webapp.md"
          echo "# STARTUP（Web App 領域）" > "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "> ⚠️ 本檔由 GitHub Actions 自動生成，請勿手動編輯。" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "---" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "## 🚨 啟動檢查（AI 必做）" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "在進行任何動作前，請先執行以下檢查：" >> "$OUTPUT"
          echo "1. **自報編號**（格式：\`A{YYYYMMDD}-{序號3位}\`）" >> "$OUTPUT"
          echo "2. **輸出 R-01 紀錄格式**：請輸出 \`- A{YYYYMMDD}-{序號3位}\`，並提示使用者更新至 \`docs/records/R-01-writers.md\`" >> "$OUTPUT"
          echo "3. **等待確認**：停下來，等待使用者回覆「已更新」或「繼續」" >> "$OUTPUT"
          echo "4. 回報「已讀取 startup」" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "---" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "## Part 1：C-00 啟動卡" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          cat docs/common/C-00-startup.md >> "$OUTPUT" 2>/dev/null || echo "(缺 C-00)" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "---" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "## Part 2：R-01 名單" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          cat docs/records/R-01-writers.md >> "$OUTPUT" 2>/dev/null || echo "(缺 R-01)" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "---" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "## Part 3：Web App 技能包" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          for f in docs/skills/W/W-*.md; do
            if [ -f "$f" ]; then
              echo "### $f" >> "$OUTPUT"
              echo "" >> "$OUTPUT"
              cat "$f" >> "$OUTPUT"
              echo "" >> "$OUTPUT"
              echo "---" >> "$OUTPUT"
              echo "" >> "$OUTPUT"
            fi
          done

      # ─────────────────────────────────────────────
      # 2. 生成 STARTUP-project-family-fin.md
      # ─────────────────────────────────────────────
      - name: Build STARTUP-project-family-fin.md
        run: |
          OUTPUT="STARTUP-project-family-fin.md"
          echo "# STARTUP（家庭 webapp 專案）" > "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "> ⚠️ 本檔由 GitHub Actions 自動生成，請勿手動編輯。" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "---" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "## Part 1：P-12 議題結論" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          cat docs/projects/family-fin/P-12-conclusion.md >> "$OUTPUT" 2>/dev/null || echo "(缺 P-12)" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "---" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "## Part 2：P-13 交接快照" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          cat docs/projects/family-fin/P-13-handoff.md >> "$OUTPUT" 2>/dev/null || echo "(缺 P-13)" >> "$OUTPUT"

      # ─────────────────────────────────────────────
      # 3. 生成 STARTUP-project-ai-training.md
      # ─────────────────────────────────────────────
      - name: Build STARTUP-project-ai-training.md
        run: |
          OUTPUT="STARTUP-project-ai-training.md"
          echo "# STARTUP（AI 訓練專案）" > "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "> ⚠️ 本檔由 GitHub Actions 自動生成，請勿手動編輯。" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "---" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "## 🚨 啟動檢查（AI 必做）" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "1. **自報編號**（格式：\`A{YYYYMMDD}-{序號3位}\`）" >> "$OUTPUT"
          echo "2. 確認已讀取 core-webapp STARTUP" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "---" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "## 專案說明" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "本專案旨在設計與優化 AI 訓練體系。" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "> 📌 待補：請將 AI 訓練相關的 P-* 檔案放入 \`docs/projects/ai-training/\` 後，重新執行 Actions。" >> "$OUTPUT"

      # ─────────────────────────────────────────────
      # 4. 生成 INDEX.md（純資料檔，只放專案清單）
      # ─────────────────────────────────────────────
      - name: Build INDEX.md
        run: |
          OUTPUT="INDEX.md"
          cat > "$OUTPUT" <<'EOF'
          # 專案索引

          > ⚠️ 本檔由 GitHub Actions 自動生成。

          ## 專案清單

          - 專案名稱：家庭 webapp
            領域：W
            核心 STARTUP：STARTUP-core-webapp.md
            專案 STARTUP：STARTUP-project-family-fin.md

          - 專案名稱：訓練 AI
            領域：W
            核心 STARTUP：STARTUP-core-webapp.md
            專案 STARTUP：STARTUP-project-ai-training.md
          EOF

      # ─────────────────────────────────────────────
      # 5. 提交變更
      # ─────────────────────────────────────────────
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "無變化，跳過"
            exit 0
          fi
          git commit -m "chore: auto-setup structure + build STARTUP [skip ci]"
          git push
