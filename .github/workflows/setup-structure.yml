# ============================================
# setup-structure.yml — 最終優化版
# ============================================

name: Setup Structure + Build Maps + Build PACKAGE-ALL

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout AI-training-files
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout v2.Family (跨倉庫)
        uses: actions/checkout@v4
        with:
          repository: tlee20860-dotcom/v2.Family
          token: ${{ secrets.CROSS_REPO_PAT }}
          path: external/v2.Family

      - name: Create directory structure
        run: |
          mkdir -p docs/common
          mkdir -p docs/skills/W
          mkdir -p docs/records
          mkdir -p docs/projects/family-fin
          mkdir -p docs/projects/ai-training

      - name: Move files to correct directories
        run: |
          for f in C-*.md; do [ -f "$f" ] && git mv "$f" docs/common/ 2>/dev/null || true; done
          for f in W-*.md; do [ -f "$f" ] && git mv "$f" docs/skills/W/ 2>/dev/null || true; done
          for f in R-*.md; do [ -f "$f" ] && git mv "$f" docs/records/ 2>/dev/null || true; done
          for f in P-*.md; do [ -f "$f" ] && git mv "$f" docs/projects/family-fin/ 2>/dev/null || true; done

      - name: Build CODE-MAP-v2.Family.md
        run: |
          OUTPUT="CODE-MAP-v2.Family.md"
          echo "# v2.Family 程式碼地圖" > "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "> 本檔由 GitHub Actions 自動生成。" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "## 檔案清單" >> "$OUTPUT"
          cd external/v2.Family
          find . -type f \( -name "*.js" -o -name "*.html" -o -name "*.css" -o -name "*.json" \) \
            -not -path "./.git/*" \
            -not -path "./node_modules/*" \
            -not -path "./.github/*" \
            | sort | while read -r file; do
            clean_path="${file#./}"
            echo "- $clean_path -> https://raw.githubusercontent.com/tlee20860-dotcom/v2.Family/main/$clean_path" >> "../../$OUTPUT"
          done
          cd ../..

      - name: Build INDEX.md
        run: |
          OUTPUT="INDEX.md"
          cat > "$OUTPUT" <<'EOF'
          # 專案索引（AI 專用倉庫地圖）

          > ⚠️ 本檔由 GitHub Actions 自動生成。

          ## 🚨 AI 啟動與自主提取指示（最高優先）

          **【語言規則】你必須嚴格使用「繁體中文」回覆，禁止使用簡體中文。**

          請嚴格執行以下步驟：
          1. 先自報編號（格式：A{YYYYMMDD}-{序號3位}）
          2. 輸出 `- A{YYYYMMDD}-{序號3位}`，並提示更新至 `docs/records/R-01-writers.md`
          3. 停下來，等使用者回覆「繼續」
          4. 列出專案清單（家庭 webapp、訓練 AI）
          5. 使用者提出需求後，執行「自主提取協議」

          ---

          ## 📋 專案清單

          - 專案名稱：家庭 webapp（領域：W）
          - 專案名稱：訓練 AI（領域：W）

          ---

          ## 🤖 自主提取協議

          你已經擁有本檔案的完整上下文。當使用者提出需求時：
          1. 自動從本檔案中找出與需求相關的所有程式碼與專案文件。
          2. **禁止詢問使用者「要讀取哪些檔案」**，直接進行分析。
          3. 直接給出修改方案，並標明參考了哪些檔案。
          4. 只有當所需資訊完全不在本檔案中時，才詢問使用者。

          ---

          ## 🗺️ 倉庫檔案地圖（AI-training-files）

          EOF

          for f in docs/common/*.md; do
            [ -f "$f" ] && echo "- $f -> https://raw.githubusercontent.com/tlee20860-dotcom/AI-training-files/main/$f" >> "$OUTPUT"
          done
          echo "" >> "$OUTPUT"
          echo "### 📂 Web App 技能包" >> "$OUTPUT"
          for f in docs/skills/W/*.md; do
            [ -f "$f" ] && echo "- $f -> https://raw.githubusercontent.com/tlee20860-dotcom/AI-training-files/main/$f" >> "$OUTPUT"
          done
          echo "" >> "$OUTPUT"
          echo "### 📂 機械記錄" >> "$OUTPUT"
          for f in docs/records/*.md; do
            [ -f "$f" ] && echo "- $f -> https://raw.githubusercontent.com/tlee20860-dotcom/AI-training-files/main/$f" >> "$OUTPUT"
          done
          echo "" >> "$OUTPUT"
          echo "### 📂 家庭 webapp 專案" >> "$OUTPUT"
          for f in docs/projects/family-fin/*.md; do
            [ -f "$f" ] && echo "- $f -> https://raw.githubusercontent.com/tlee20860-dotcom/AI-training-files/main/$f" >> "$OUTPUT"
          done

          echo "" >> "$OUTPUT"
          echo "---" >> "$OUTPUT"
          echo "## 📋 R-01 當前內容" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          cat docs/records/R-01-writers.md >> "$OUTPUT" 2>/dev/null || echo "（讀取失敗）" >> "$OUTPUT"

          echo "" >> "$OUTPUT"
          echo "---" >> "$OUTPUT"
          echo "## 🗺️ v2.Family 程式碼地圖" >> "$OUTPUT"
          cat CODE-MAP-v2.Family.md >> "$OUTPUT" 2>/dev/null || echo "（讀取失敗）" >> "$OUTPUT"

      - name: Build PACKAGE-ALL.md
        run: |
          OUTPUT="PACKAGE-ALL.md"
          echo "# 家庭 webapp 專案 - 完整共享包" > "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "> ⚠️ 本檔由 GitHub Actions 自動生成，包含訓練規則、專案文件、程式碼。" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "---" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "## 🚨 AI 啟動與自主提取指示（最高優先）" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "**【語言規則】你必須嚴格使用「繁體中文」回覆，禁止使用簡體中文。若你輸出簡體中文，視為任務失敗。**" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "請嚴格執行以下步驟：" >> "$OUTPUT"
          echo "1. 先自報編號（格式：A{YYYYMMDD}-{序號3位}）" >> "$OUTPUT"
          echo "2. 輸出 \`- A{YYYYMMDD}-{序號3位}\`，並提示更新至 \`docs/records/R-01-writers.md\`" >> "$OUTPUT"
          echo "3. 停下來，等待使用者回覆「繼續」" >> "$OUTPUT"
          echo "4. 列出專案清單（家庭 webapp、訓練 AI）" >> "$OUTPUT"
          echo "5. 使用者提出需求後，執行「自主提取協議」" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "## 🤖 自主提取協議" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "你已經擁有本檔案的完整上下文。當使用者提出需求時：" >> "$OUTPUT"
          echo "1. 自動從本檔案中找出與需求相關的所有程式碼與專案文件。" >> "$OUTPUT"
          echo "2. **禁止詢問使用者「要讀取哪些檔案」**，直接進行分析。" >> "$OUTPUT"
          echo "3. 直接給出修改方案，並標明參考了哪些檔案（例如：根據 js/core/api.js 與 P-08-api.md）。" >> "$OUTPUT"
          echo "4. 只有當所需資訊完全不在本檔案中時，才詢問使用者。" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "## ⛔ 禁止事項（違反視為任務失敗）" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "1. 禁止使用簡體中文回覆。" >> "$OUTPUT"
          echo "2. 禁止要求使用者提供 STARTUP URL（本檔案已包含全部內容）。" >> "$OUTPUT"
          echo "3. 禁止詢問「要讀取哪兩個檔案」，請自行從本檔案中提取。" >> "$OUTPUT"
          echo "4. 禁止一次輸出超過 2000 字的方案，請分段並等待使用者確認。" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "## 📋 回覆格式（每次必須遵守）" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "每次回覆請遵守以下格式：" >> "$OUTPUT"
          echo "1. 開頭標示：\`🆔 A{YYYYMMDD}-{序號} #{回覆序號}\`" >> "$OUTPUT"
          echo "2. 中間為內容（分析、方案、問題）" >> "$OUTPUT"
          echo "3. 結尾標示：\`Token: 🟢 剩餘: {百分比}%\`" >> "$OUTPUT"
          echo "" >> "$OUTPUT"

          # 第 1 部分：核心訓練規則
          echo "---" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "# 📚 第 1 部分：核心訓練規則" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          for f in \
            docs/common/C-00-startup.md \
            docs/common/C-01-profile.md \
            docs/common/C-02-rules.md \
            docs/common/C-04-delivery.md \
            docs/records/R-01-writers.md
          do
            if [ -f "$f" ]; then
              echo "---" >> "$OUTPUT"
              echo "" >> "$OUTPUT"
              echo "## 📄 $f" >> "$OUTPUT"
              echo "" >> "$OUTPUT"
              cat "$f" >> "$OUTPUT"
              echo "" >> "$OUTPUT"
            fi
          done

          # 第 2 部分：家庭 webapp 專案文件
          echo "---" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "# 📁 第 2 部分：家庭 webapp 專案文件" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          for f in docs/projects/family-fin/*.md; do
            if [ -f "$f" ]; then
              echo "---" >> "$OUTPUT"
              echo "" >> "$OUTPUT"
              echo "## 📄 $f" >> "$OUTPUT"
              echo "" >> "$OUTPUT"
              cat "$f" >> "$OUTPUT"
              echo "" >> "$OUTPUT"
            fi
          done

          # 第 3 部分：v2.Family 程式碼
          echo "---" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "# 💻 第 3 部分：v2.Family 專案程式碼" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          cd external/v2.Family
          find . -type f \( -name "*.js" -o -name "*.html" -o -name "*.css" -o -name "*.json" \) \
            -not -path "./.git/*" \
            -not -path "./node_modules/*" \
            -not -path "./.github/*" \
            | sort | while read -r file; do
            clean_path="${file#./}"
            echo "---" >> "../../$OUTPUT"
            echo "" >> "../../$OUTPUT"
            echo "## 📄 $clean_path" >> "../../$OUTPUT"
            echo "" >> "../../$OUTPUT"
            echo '```' >> "../../$OUTPUT"
            cat "$file" >> "../../$OUTPUT"
            echo '```' >> "../../$OUTPUT"
            echo "" >> "../../$OUTPUT"
          done
          cd ../..

          echo "" >> "$OUTPUT"
          echo "/* ═══ EOF ═══ */" >> "$OUTPUT"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "無變化，跳過"
            exit 0
          fi
          git commit -m "chore: auto-build PACKAGE-ALL + maps [skip ci]"
          git push