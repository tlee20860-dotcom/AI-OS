# ============================================
# setup-structure.yml — 手動觸發 + 跨倉庫掃描 + 生成雙地圖
# 位置：.github/workflows/setup-structure.yml
# ============================================

name: Setup Structure + Build Maps

on:
  workflow_dispatch:  # 只允許手動觸發

jobs:
  build-maps:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout AI-training-files
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout v2.Family (跨倉庫)
        uses: actions/checkout@v4
        with:
          repository: tlee20860-dotcom/v2.Family
          token: ${{ secrets.CROSS_REPO_PAT }}
          path: external/v2.Family

      - name: Create directory structure
        run: |
          mkdir -p docs/common
          mkdir -p docs/skills/W
          mkdir -p docs/records
          mkdir -p docs/projects/family-fin
          mkdir -p docs/projects/ai-training

      - name: Move files (若尚未移動)
        run: |
          for f in C-*.md; do [ -f "$f" ] && git mv "$f" docs/common/ 2>/dev/null || true; done
          for f in W-*.md; do [ -f "$f" ] && git mv "$f" docs/skills/W/ 2>/dev/null || true; done
          for f in R-*.md; do [ -f "$f" ] && git mv "$f" docs/records/ 2>/dev/null || true; done
          for f in P-*.md; do [ -f "$f" ] && git mv "$f" docs/projects/family-fin/ 2>/dev/null || true; done

      - name: Build CODE-MAP-v2.Family.md
        run: |
          OUTPUT="CODE-MAP-v2.Family.md"
          echo "# v2.Family 程式碼地圖" > "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "> 本檔由 GitHub Actions 自動生成，列出 v2.Family 倉庫中所有程式碼檔案的路徑與 Raw URL。" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "## Raw URL 拼接規則" >> "$OUTPUT"
          echo 'https://raw.githubusercontent.com/tlee20860-dotcom/v2.Family/main/' >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "## 檔案清單" >> "$OUTPUT"
          cd external/v2.Family
          find . -type f \( -name "*.js" -o -name "*.html" -o -name "*.css" -o -name "*.json" \) | sort | while read -r file; do
            clean_path="${file#./}"
            echo "- $clean_path -> https://raw.githubusercontent.com/tlee20860-dotcom/v2.Family/main/$clean_path" >> "../../$OUTPUT"
          done
          cd ../..

      - name: Build INDEX.md
        run: |
          OUTPUT="INDEX.md"
          cat > "$OUTPUT" <<'EOF'
          # 專案索引（AI 專用倉庫地圖）

          > ⚠️ 本檔由 GitHub Actions 自動生成。

          ## 🚨 AI 啟動與讀取指示（最高優先）

          請嚴格執行以下步驟，禁止跳過、禁止自行捏造不存在的檔案：
          1. **先自報編號**：格式 A{YYYYMMDD}-{序號3位}，並輸出一行 `- A{YYYYMMDD}-{序號3位}`。
          2. **等待確認**：停下來，等使用者回覆「已更新」或「繼續」。
          3. **列出專案**：使用者確認後，列出下方「專案清單」中的所有專案。
          4. **執行「分步讀取協議」**（見下方說明）。

          ---

          ## 📋 專案清單

          - 專案名稱：家庭 webapp（領域：W）
            核心 STARTUP：https://raw.githubusercontent.com/tlee20860-dotcom/AI-training-files/main/STARTUP-core-webapp.md
            專案 STARTUP：https://raw.githubusercontent.com/tlee20860-dotcom/AI-training-files/main/STARTUP-project-family-fin.md
          - 專案名稱：訓練 AI（領域：W）
            核心 STARTUP：https://raw.githubusercontent.com/tlee20860-dotcom/AI-training-files/main/STARTUP-core-webapp.md
            專案 STARTUP：https://raw.githubusercontent.com/tlee20860-dotcom/AI-training-files/main/STARTUP-project-ai-training.md

          ---

          ## 📖 分步讀取協議（AI 必做）

          當使用者選擇專案並提出需求時，你必須：
          1. 從下方「倉庫檔案地圖」與「程式碼地圖」中找出相關檔案。
          2. 規劃讀取清單，每次最多讀取 2 個檔案。
          3. 輸出清單並詢問：「是否同意開始讀取第 1 步？」
          4. 收到「確認」後才讀取，讀完摘要，再問是否繼續下一步。
          5. 全部讀完後才提供修改方案。

          ⚠️ 禁止一次讀取超過 2 個檔案；禁止未讀完就給方案。

          ---

          ## 🗺️ 倉庫檔案地圖（AI-training-files）

          ### 📂 核心大腦 (docs/common/)
          EOF

          for f in docs/common/*.md; do
            [ -f "$f" ] && echo "- $f -> https://raw.githubusercontent.com/tlee20860-dotcom/AI-training-files/main/$f" >> "$OUTPUT"
          done

          echo "" >> "$OUTPUT"
          echo "### 📂 Web App 技能包 (docs/skills/W/)" >> "$OUTPUT"
          for f in docs/skills/W/*.md; do
            [ -f "$f" ] && echo "- $f -> https://raw.githubusercontent.com/tlee20860-dotcom/AI-training-files/main/$f" >> "$OUTPUT"
          done

          echo "" >> "$OUTPUT"
          echo "### 📂 機械記錄 (docs/records/)" >> "$OUTPUT"
          for f in docs/records/*.md; do
            [ -f "$f" ] && echo "- $f -> https://raw.githubusercontent.com/tlee20860-dotcom/AI-training-files/main/$f" >> "$OUTPUT"
          done

          echo "" >> "$OUTPUT"
          echo "### 📂 家庭 webapp 專案 (docs/projects/family-fin/)" >> "$OUTPUT"
          for f in docs/projects/family-fin/*.md; do
            [ -f "$f" ] && echo "- $f -> https://raw.githubusercontent.com/tlee20860-dotcom/AI-training-files/main/$f" >> "$OUTPUT"
          done

          echo "" >> "$OUTPUT"
          echo "### 📂 訓練 AI 專案 (docs/projects/ai-training/)" >> "$OUTPUT"
          for f in docs/projects/ai-training/*.md; do
            [ -f "$f" ] && echo "- $f -> https://raw.githubusercontent.com/tlee20860-dotcom/AI-training-files/main/$f" >> "$OUTPUT"
          done

          echo "" >> "$OUTPUT"
          echo "---" >> "$OUTPUT"
          echo "## 📋 R-01 當前內容（AI 請直接讀取）" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          cat docs/records/R-01-writers.md >> "$OUTPUT" 2>/dev/null || echo "（R-01 讀取失敗）" >> "$OUTPUT"

          echo "" >> "$OUTPUT"
          echo "---" >> "$OUTPUT"
          echo "## 🗺️ v2.Family 程式碼地圖" >> "$OUTPUT"
          cat CODE-MAP-v2.Family.md >> "$OUTPUT" 2>/dev/null || echo "（CODE-MAP 讀取失敗）" >> "$OUTPUT"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "無變化，跳過"
            exit 0
          fi
          git commit -m "chore: auto-build maps [skip ci]"
          git push