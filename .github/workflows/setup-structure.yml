# ============================================
# setup-structure.yml — 一次性目錄重組 + 產 STARTUP
# 位置：.github/workflows/setup-structure.yml
# ============================================
# 功能：
#   1. 首次執行：把根目錄的 C-*/W-*/P-*/R-01 搬到子資料夾
#   2. 產出 STARTUP-core-webapp.md + STARTUP-project-family-fin.md + INDEX.md
#   3. 之後每次 push 自動更新 STARTUP
# ============================================

name: Setup Structure + Build STARTUP

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  setup-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 步驟 1：建目錄
      - name: Create directory structure
        run: |
          mkdir -p docs/common
          mkdir -p docs/skills/W
          mkdir -p docs/records
          mkdir -p docs/projects/family-fin

      # 步驟 2：搬檔
      - name: Move C-* to docs/common/
        run: |
          for f in C-*.md; do
            if [ -f "$f" ]; then
              git mv "$f" docs/common/ || mv "$f" docs/common/
            fi
          done

      - name: Move W-* to docs/skills/W/
        run: |
          for f in W-*.md; do
            if [ -f "$f" ]; then
              git mv "$f" docs/skills/W/ || mv "$f" docs/skills/W/
            fi
          done

      - name: Move R-* to docs/records/
        run: |
          for f in R-*.md; do
            if [ -f "$f" ]; then
              git mv "$f" docs/records/ || mv "$f" docs/records/
            fi
          done

      - name: Move P-* to docs/projects/family-fin/
        run: |
          for f in P-*.md; do
            if [ -f "$f" ]; then
              git mv "$f" docs/projects/family-fin/ || mv "$f" docs/projects/family-fin/
            fi
          done

      # 步驟 3：產 STARTUP-core-webapp.md
      - name: Build STARTUP-core-webapp.md
        run: |
          OUTPUT="STARTUP-core-webapp.md"
          echo "# STARTUP（Web App 領域）" > "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "> ⚠️ 本檔由 GitHub Actions 自動生成，請勿手動編輯。" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "---" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "## Part 1：C-00 啟動卡" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          cat docs/common/C-00-startup.md >> "$OUTPUT" 2>/dev/null || echo "(缺 C-00)" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "---" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "## Part 2：R-01 名單" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          cat docs/records/R-01-writers.md >> "$OUTPUT" 2>/dev/null || echo "(缺 R-01)" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "---" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "## Part 3：Web App 技能包" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          for f in docs/skills/W/W-*.md; do
            if [ -f "$f" ]; then
              echo "### $f" >> "$OUTPUT"
              echo "" >> "$OUTPUT"
              cat "$f" >> "$OUTPUT"
              echo "" >> "$OUTPUT"
              echo "---" >> "$OUTPUT"
              echo "" >> "$OUTPUT"
            fi
          done

      # 步驟 4：產 STARTUP-project-family-fin.md
      - name: Build STARTUP-project-family-fin.md
        run: |
          OUTPUT="STARTUP-project-family-fin.md"
          echo "# STARTUP（家庭 webapp 專案）" > "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "> ⚠️ 本檔由 GitHub Actions 自動生成，請勿手動編輯。" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "---" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "## Part 1：P-12 議題結論" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          cat docs/projects/family-fin/P-12-conclusion.md >> "$OUTPUT" 2>/dev/null || echo "(缺 P-12)" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "---" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "## Part 2：P-13 交接快照" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          cat docs/projects/family-fin/P-13-handoff.md >> "$OUTPUT" 2>/dev/null || echo "(缺 P-13)" >> "$OUTPUT"

      # 步驟 5：產 INDEX.md
      - name: Build INDEX.md
        run: |
          OUTPUT="INDEX.md"
          echo "# 專案索引" > "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "> ⚠️ 本檔由 GitHub Actions 自動生成。" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "## 使用方式" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "1. 貼本檔 URL 給 AI" >> "$OUTPUT"
          echo "2. AI 列出所有專案" >> "$OUTPUT"
          echo "3. 你說要哪個專案" >> "$OUTPUT"
          echo "4. AI 給你 2 條 STARTUP URL" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "## 專案清單" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "| 專案 | 領域 | 核心 STARTUP | 專案 STARTUP |" >> "$OUTPUT"
          echo "|---|---|---|---|" >> "$OUTPUT"
          echo "| 家庭 webapp | W | STARTUP-core-webapp.md | STARTUP-project-family-fin.md |" >> "$OUTPUT"

      # 步驟 6：Commit & Push
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "無變化，跳過"
            exit 0
          fi
          git commit -m "chore: auto-setup structure + build STARTUP [skip ci]"
          git push
