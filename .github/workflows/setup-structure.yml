# ============================================
# setup-structure.yml — 完整版（含 PACKAGE-ALL 合併包）
# ============================================

name: Setup Structure + Build Maps + Build PACKAGE-ALL

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout AI-training-files
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout v2.Family (跨倉庫)
        uses: actions/checkout@v4
        with:
          repository: tlee20860-dotcom/v2.Family
          token: ${{ secrets.CROSS_REPO_PAT }}
          path: external/v2.Family

      - name: Create directory structure
        run: |
          mkdir -p docs/common
          mkdir -p docs/skills/W
          mkdir -p docs/records
          mkdir -p docs/projects/family-fin
          mkdir -p docs/projects/ai-training

      - name: Move files to correct directories
        run: |
          for f in C-*.md; do [ -f "$f" ] && git mv "$f" docs/common/ 2>/dev/null || true; done
          for f in W-*.md; do [ -f "$f" ] && git mv "$f" docs/skills/W/ 2>/dev/null || true; done
          for f in R-*.md; do [ -f "$f" ] && git mv "$f" docs/records/ 2>/dev/null || true; done
          for f in P-*.md; do [ -f "$f" ] && git mv "$f" docs/projects/family-fin/ 2>/dev/null || true; done

      - name: Build CODE-MAP-v2.Family.md
        run: |
          OUTPUT="CODE-MAP-v2.Family.md"
          echo "# v2.Family 程式碼地圖" > "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "> 本檔由 GitHub Actions 自動生成。" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "## 檔案清單" >> "$OUTPUT"
          cd external/v2.Family
          find . -type f \( -name "*.js" -o -name "*.html" -o -name "*.css" -o -name "*.json" \) \
            -not -path "./.git/*" \
            -not -path "./node_modules/*" \
            -not -path "./.github/*" \
            | sort | while read -r file; do
            clean_path="${file#./}"
            echo "- $clean_path -> https://raw.githubusercontent.com/tlee20860-dotcom/v2.Family/main/$clean_path" >> "../../$OUTPUT"
          done
          cd ../..

      - name: Build INDEX.md
        run: |
          OUTPUT="INDEX.md"
          cat > "$OUTPUT" <<'EOF'
          # 專案索引（AI 專用倉庫地圖）

          > ⚠️ 本檔由 GitHub Actions 自動生成。

          ## 🚨 AI 啟動與讀取指示（最高優先）

          請嚴格執行以下步驟：
          1. 先自報編號（格式：A{YYYYMMDD}-{序號3位}）
          2. 輸出 `- A{YYYYMMDD}-{序號3位}`，並提示更新至 `docs/records/R-01-writers.md`
          3. 停下來，等使用者回覆「繼續」
          4. 列出專案清單（家庭 webapp、訓練 AI）
          5. 使用者提出需求後，執行「分步讀取協議」

          ---

          ## 📋 專案清單

          - 專案名稱：家庭 webapp（領域：W）
          - 專案名稱：訓練 AI（領域：W）

          ---

          ## 📖 分步讀取協議

          1. 從下方地圖找出相關檔案。
          2. 每次最多讀取 2 個檔案，讀取後等待確認。
          3. 全部讀完才給方案。

          ---

          ## 🗺️ 倉庫檔案地圖（AI-training-files）

          EOF

          for f in docs/common/*.md; do
            [ -f "$f" ] && echo "- $f -> https://raw.githubusercontent.com/tlee20860-dotcom/AI-training-files/main/$f" >> "$OUTPUT"
          done
          echo "" >> "$OUTPUT"
          echo "### 📂 Web App 技能包" >> "$OUTPUT"
          for f in docs/skills/W/*.md; do
            [ -f "$f" ] && echo "- $f -> https://raw.githubusercontent.com/tlee20860-dotcom/AI-training-files/main/$f" >> "$OUTPUT"
          done
          echo "" >> "$OUTPUT"
          echo "### 📂 機械記錄" >> "$OUTPUT"
          for f in docs/records/*.md; do
            [ -f "$f" ] && echo "- $f -> https://raw.githubusercontent.com/tlee20860-dotcom/AI-training-files/main/$f" >> "$OUTPUT"
          done
          echo "" >> "$OUTPUT"
          echo "### 📂 家庭 webapp 專案" >> "$OUTPUT"
          for f in docs/projects/family-fin/*.md; do
            [ -f "$f" ] && echo "- $f -> https://raw.githubusercontent.com/tlee20860-dotcom/AI-training-files/main/$f" >> "$OUTPUT"
          done

          echo "" >> "$OUTPUT"
          echo "---" >> "$OUTPUT"
          echo "## 📋 R-01 當前內容" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          cat docs/records/R-01-writers.md >> "$OUTPUT" 2>/dev/null || echo "（讀取失敗）" >> "$OUTPUT"

          echo "" >> "$OUTPUT"
          echo "---" >> "$OUTPUT"
          echo "## 🗺️ v2.Family 程式碼地圖" >> "$OUTPUT"
          cat CODE-MAP-v2.Family.md >> "$OUTPUT" 2>/dev/null || echo "（讀取失敗）" >> "$OUTPUT"

      - name: Build PACKAGE-ALL.md
        run: |
          OUTPUT="PACKAGE-ALL.md"
          echo "# 家庭 webapp 專案 - 完整共享包" > "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "> ⚠️ 本檔由 GitHub Actions 自動生成，包含訓練規則、專案文件、程式碼。" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "---" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "## 🚨 AI 啟動指示（最高優先）" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "請嚴格執行以下步驟：" >> "$OUTPUT"
          echo "1. 先自報編號（格式：A{YYYYMMDD}-{序號3位}）" >> "$OUTPUT"
          echo "2. 輸出 \`- A{YYYYMMDD}-{序號3位}\`，提示更新至 \`docs/records/R-01-writers.md\`" >> "$OUTPUT"
          echo "3. 停下來，等待使用者回覆「繼續」" >> "$OUTPUT"
          echo "4. 列出專案清單（家庭 webapp、訓練 AI）" >> "$OUTPUT"
          echo "5. 使用者提出需求後，執行「分步讀取協議」：每次最多讀取 2 個檔案，讀取後等待確認" >> "$OUTPUT"
          echo "" >> "$OUTPUT"

          # 第 1 部分：核心訓練規則
          echo "---" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "# 📚 第 1 部分：核心訓練規則" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          for f in \
            docs/common/C-00-startup.md \
            docs/common/C-01-profile.md \
            docs/common/C-02-rules.md \
            docs/common/C-04-delivery.md \
            docs/records/R-01-writers.md
          do
            if [ -f "$f" ]; then
              echo "---" >> "$OUTPUT"
              echo "" >> "$OUTPUT"
              echo "## 📄 $f" >> "$OUTPUT"
              echo "" >> "$OUTPUT"
              cat "$f" >> "$OUTPUT"
              echo "" >> "$OUTPUT"
            fi
          done

          # 第 2 部分：家庭 webapp 專案文件
          echo "---" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "# 📁 第 2 部分：家庭 webapp 專案文件" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          for f in docs/projects/family-fin/*.md; do
            if [ -f "$f" ]; then
              echo "---" >> "$OUTPUT"
              echo "" >> "$OUTPUT"
              echo "## 📄 $f" >> "$OUTPUT"
              echo "" >> "$OUTPUT"
              cat "$f" >> "$OUTPUT"
              echo "" >> "$OUTPUT"
            fi
          done

          # 第 3 部分：v2.Family 程式碼
          echo "---" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "# 💻 第 3 部分：v2.Family 專案程式碼" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          cd external/v2.Family
          find . -type f \( -name "*.js" -o -name "*.html" -o -name "*.css" -o -name "*.json" \) \
            -not -path "./.git/*" \
            -not -path "./node_modules/*" \
            -not -path "./.github/*" \
            | sort | while read -r file; do
            clean_path="${file#./}"
            echo "---" >> "../../$OUTPUT"
            echo "" >> "../../$OUTPUT"
            echo "## 📄 $clean_path" >> "../../$OUTPUT"
            echo "" >> "../../$OUTPUT"
            echo '```' >> "../../$OUTPUT"
            cat "$file" >> "../../$OUTPUT"
            echo '```' >> "../../$OUTPUT"
            echo "" >> "../../$OUTPUT"
          done
          cd ../..

          echo "" >> "$OUTPUT"
          echo "/* ═══ EOF ═══ */" >> "$OUTPUT"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "無變化，跳過"
            exit 0
          fi
          git commit -m "chore: auto-build PACKAGE-ALL + maps [skip ci]"
          git push